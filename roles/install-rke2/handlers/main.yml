---
# Handlers for install-rke2 role

- name: restart rke2-server
  systemd:
    name: rke2-server
    state: restarted
  when: inventory_hostname == 'MASTER' and rke2_restart_on_change

- name: restart rke2-agent
  systemd:
    name: rke2-agent
    state: restarted
  when: inventory_hostname != 'MASTER' and rke2_restart_on_change
