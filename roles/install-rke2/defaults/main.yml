---
# RKE2 version to install (empty for latest)
rke2_version: ""

# RKE2 channel to use (stable, latest, or v1.xx)
rke2_channel: "stable"

# Directory to store RKE2 configuration
rke2_config_dir: "/etc/rancher/rke2"

# Directory to store RKE2 data
rke2_data_dir: "/var/lib/rancher/rke2"

# Whether to restart RKE2 service on configuration changes
rke2_restart_on_change: true

# Whether to enable the RKE2 service
rke2_enabled: true

# Whether to start the RKE2 service
rke2_started: true

# Additional RKE2 server configuration
rke2_server_config: {}

# Additional RKE2 agent configuration
rke2_agent_config: {}

# Longhorn prerequisites
longhorn_prerequisites:
  debian:
    - open-iscsi
    - nfs-common
    - xfsprogs
    - lvm2
  redhat:
    - iscsi-initiator-utils
    - nfs-utils
    - xfsprogs
    - lvm2
