- name: Install K3s dependencies (Debian/Ubuntu)
  apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install K3s dependencies (RedHat/Rocky)
  dnf:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Install K3s on master
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Get K3s token
  shell: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  when: inventory_hostname == 'MASTER'

- name: Install K3s on worker nodes
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ hostvars['MASTER']['ansible_host'] }}:6443" K3S_TOKEN="{{ hostvars['MASTER']['k3s_token']['stdout'] }}" sh -
  when: inventory_hostname != 'MASTER'
