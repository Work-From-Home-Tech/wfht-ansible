---
# roles/firewall/tasks/Debian.yml

- name: Install UFW on Ubuntu
  apt:
    name: ufw
    state: present
    update_cache: yes

- name: Reset UFW
  command: ufw --force reset
  changed_when: true

- name: Configure SSH access first
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow all outgoing traffic
  ufw:
    rule: allow
    direction: out

- name: Allow incoming traffic on specific ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '80'
    - '443'

- name: Allow incoming UDP traffic on port 51820
  ufw:
    rule: allow
    port: '51820'
    proto: udp

- name: Set default policies
  ufw:
    state: enabled
    policy: deny
    direction: "{{ item }}"
  loop:
    - incoming
    - outgoing

- name: Enable UFW
  ufw:
    state: enabled
