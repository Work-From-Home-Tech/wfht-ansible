---
- name: Get latest fastfetch release information
  uri:
    url: "{{ fastfetch_github_api_url }}"
    method: GET
    return_content: yes
  register: fastfetch_release_info

- name: Extract download URL for .rpm package
  set_fact:
    fastfetch_rpm_url: "{{ item.browser_download_url }}"
  loop: "{{ fastfetch_release_info.json.assets }}"
  when: item.name is match('fastfetch-linux-amd64\\.rpm$')

- name: Fail if .rpm package not found
  fail:
    msg: "Could not find fastfetch-linux-amd64.rpm in the latest release"
  when: fastfetch_rpm_url is not defined

- name: Download fastfetch .rpm package
  get_url:
    url: "{{ fastfetch_rpm_url }}"
    dest: "{{ fastfetch_temp_dir }}/fastfetch-linux-amd64.rpm"
    mode: '0644'
    timeout: 30
  register: fastfetch_download

- name: Install fastfetch from .rpm package
  package:
    name: "{{ fastfetch_temp_dir }}/fastfetch-linux-amd64.rpm"
    state: present
    disable_gpg_check: true
  become: true

- name: Clean up downloaded .rpm package
  file:
    path: "{{ fastfetch_temp_dir }}/fastfetch-linux-amd64.rpm"
    state: absent
  when: fastfetch_cleanup_downloads | bool
