---
- name: Create CA certificates directory
  file:
    path: /usr/local/share/ca-certificates
    state: directory
    mode: '0755'

- name: Copy CA certificate
  copy:
    src: my.certificate.com.crt
    dest: /usr/local/share/ca-certificates/my.certificate.com.crt
    mode: '0644'
  notify: update ca certificates

- name: Force update CA certificates
  command: update-ca-certificates
  changed_when: true
